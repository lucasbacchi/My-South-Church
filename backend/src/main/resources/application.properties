# Server Port
server.port=${PORT:8080}

# Spring Boot Login Info
spring.security.user.name=${SPRING_SECURITY_USER_NAME}
spring.security.user.password=${SPRING_SECURITY_USER_PASSWORD}

# App Config
spring.application.name=My South Church Backend

# Tells Spring Security: "Trust tokens signed by Google/Firebase"
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://securetoken.google.com/my-south-church

# The "Root" group that everyone must be in
google.groups.root-group=${GOOGLE_ROOT_GROUP_EMAIL}

# Google Workspace Domain
google.workspace.domain=${GOOGLE_WORKSPACE_DOMAIN}

# Goolge Drive Test File ID
google.drive.test-file-id=${GOOGLE_DRIVE_TEST_FILE_ID}

# Google Account verification throttling (ms between checks)
google.account.verify.delay-ms=${GOOGLE_ACCOUNT_VERIFY_DELAY_MS:800}

# Perform a full scan every N days
google.account.verify.full-scan-interval-days=${GOOGLE_ACCOUNT_VERIFY_FULL_SCAN_INTERVAL_DAYS:90}

# Tell Spring to look at the "X-Forwarded-Proto" header
server.forward-headers-strategy=framework

# Trust the load balancer's IP
server.tomcat.remoteip.internal-proxies=.*

# Database Connection URL
spring.datasource.url=${DB_URL}

# Database Credentials
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate Settings
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Show SQL queries in the console (Optional, helpful for debugging)
spring.jpa.show-sql=true

# This makes sure error messages are sent when server error occurs
server.error.include-message=always

# Logging Configuration
logging.file.name=backend/logs/MSCLog.log

# Drive indexer configuration
drive.index.enabled=${DRIVE_INDEX_ENABLED:true}
drive.index.refresh-on-startup=${DRIVE_INDEX_REFRESH_ON_STARTUP:true}
drive.index.refresh-interval-ms=${DRIVE_INDEX_REFRESH_INTERVAL_MS:3600000}
drive.index.initial-delay-ms=${DRIVE_INDEX_INITIAL_DELAY_MS:60000}
drive.index.skip-drive-ids=${DRIVE_INDEX_SKIP_DRIVE_IDS:}

# Disable Open Session in View to prevent lazy loading issues outside of service layer
spring.jpa.open-in-view=false
