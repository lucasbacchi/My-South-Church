# Server Port
server.port=8080

# Spring Boot Login Info
spring.security.user.name=test-user
spring.security.user.password=test-password

# App Config
spring.application.name=My South Church Backend

# Firebase/JWT
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://securetoken.google.com/my-south-church

# Google config — dummy values
google.groups.root-group=test-root-group@test.com
google.workspace.domain=test.com
google.drive.test-file-id=test-file-id

# Google account verification
google.account.verify.delay-ms=800
google.account.verify.full-scan-interval-days=90

# Database — H2 in-memory
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

# JPA Settings
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.show-sql=true

# Drive indexer — disable for tests
drive.index.enabled=false
drive.index.refresh-on-startup=false
drive.index.refresh-interval-ms=3600000
drive.index.initial-delay-ms=60000
drive.index.skip-drive-ids=

# Misc
server.error.include-message=always
spring.jpa.open-in-view=false