name: CD

on:
  push:
    branches: [ "main" ]

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}

      - name: Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Build and Push Container with Jib
        run: |
          token=$(gcloud auth print-access-token)
          mvn compile jib:build \
            -Djib.to.auth.username=oauth2accesstoken \
            -Djib.to.auth.password=$token \
            --no-transfer-progress

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy backend-api \
            --image gcr.io/my-south-church/backend-api \
            --platform managed \
            --region us-east1 \
            --allow-unauthenticated \
            --set-secrets="SPRING_SECURITY_USER_NAME=SPRING_SECURITY_USER_NAME:latest" \
            --set-secrets="SPRING_SECURITY_USER_PASSWORD=SPRING_SECURITY_USER_PASSWORD:latest" \
            --set-secrets="GOOGLE_ROOT_GROUP_EMAIL=GOOGLE_ROOT_GROUP_EMAIL:latest" \
            --set-secrets="GOOGLE_WORKSPACE_DOMAIN=GOOGLE_WORKSPACE_DOMAIN:latest" \
            --set-secrets="DB_URL=DB_URL:latest" \
            --set-secrets="DB_USERNAME=DB_USERNAME:latest" \
            --set-secrets="DB_PASSWORD=DB_PASSWORD:latest" \
            --set-secrets="/app/certs/truststore.jks=AIVEN_TRUSTSTORE:latest" \
            --set-secrets="/app/secrets/google-key.json=GOOGLE_CREDENTIALS_JSON:latest" \
            --set-env-vars="GOOGLE_APPLICATION_CREDENTIALS=/app/secrets/google-key.json" \
            --set-env-vars="GOOGLE_DRIVE_TEST_FILE_ID=GOOGLE_DRIVE_TEST_FILE_ID:latest" \
            --set-env-vars="SPRINGDOC_API_DOCS_ENABLED=false" \
            --set-env-vars="SPRINGDOC_SWAGGER_UI_ENABLED=false"

